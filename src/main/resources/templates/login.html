<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LightHouse — Entrar</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/style.css(v=9)}" />
</head>

<body class="login-page">
    <main class="login-shell">
        <div class="login-card">
            <div class="logo login-logo">
                <div class="logo-icon"></div>
                <div class="logo-text">LIGHT<span>HOUSE</span></div>
            </div>

            <p class="login-subtitle">Acesso ao painel de automação</p>

            <div th:if="${param.error}" class="login-alert error">Usuário ou senha inválidos.</div>
            <div th:if="${param.logout}" class="login-alert success">Sessão encerrada com sucesso.</div>
            <div th:if="${param.denied}" class="login-alert error">Você não tem permissão para acessar esse recurso.</div>

            <form th:action="@{/login}" method="post" class="login-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label class="login-label" for="username">Usuário</label>
                <input class="login-input" type="text" id="username" name="username" autocomplete="username" required />

                <label class="login-label" for="password">Senha</label>
                <input class="login-input" type="password" id="password" name="password" autocomplete="current-password" required />

                <button class="login-submit" type="submit">ENTRAR</button>
            </form>
        </div>
    </main>
</body>

</html>
