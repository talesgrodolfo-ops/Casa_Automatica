spring.application.name=LightHouse

spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:LightHouse}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8000

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Segurança — obrigatório definir via variáveis de ambiente ou application-local.properties (gitignored)
lighthouse.security.user.name=${LIGHTHOUSE_USER:admin}
lighthouse.security.user.password=${LIGHTHOUSE_PASSWORD:}
lighthouse.security.device-api-key=${LIGHTHOUSE_DEVICE_API_KEY:}
lighthouse.security.rate-limit.requests-per-minute=${LIGHTHOUSE_RATE_LIMIT:120}
